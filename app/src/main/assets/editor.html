<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #1A0505; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #canvas { flex-grow: 1; background: #ffffff; color: #000000; padding: 16px; overflow-y: auto; }
        
        /* The Canva-Style Nested Toolbar */
        #toolbar-container { height: 80px; background: #2D1515; display: flex; flex-direction: column; }
        .tool-row { display: flex; overflow-x: auto; padding: 8px; gap: 8px; transition: 0.3s; }
        .tool-btn { background: #D4AF37; color: #1A0505; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .sub-btn { background: #442222; color: #D4AF37; border: 1px solid #D4AF37; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="canvas" contenteditable="true">
        <h2>Maha Nested Editor</h2>
        <p>Tap the tools below to see nested menus.</p>
    </div>
    
    <div id="toolbar-container">
        <!-- Level 1: Main Categories -->
        <div id="main-tools" class="tool-row">
            <button class="tool-btn" onclick="showSubMenu('text-tools')">📝 Text</button>
            <button class="tool-btn" onclick="showSubMenu('image-tools')">🖼️ Image</button>
            <button class="tool-btn" onclick="showSubMenu('layout-tools')">📐 Layout</button>
        </div>
        
        <!-- Level 2: Nested Sub-Tools (Hidden by default) -->
        <div id="text-tools" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn">Bold</button>
            <button class="tool-btn sub-btn">Font Size</button>
            <button class="tool-btn sub-btn">Color</button>
        </div>
        
        <div id="image-tools" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn">Crop</button>
            <button class="tool-btn sub-btn">Filter</button>
            <button class="tool-btn sub-btn">Remove BG</button>
        </div>
    </div>

    <script>
        function showSubMenu(menuId) {
            // Hide main menu
            document.getElementById('main-tools').classList.add('hidden');
            // Show the specific nested tools
            document.getElementById(menuId).classList.remove('hidden');
        }

        function showMain() {
            // Hide all sub-menus
            document.getElementById('text-tools').classList.add('hidden');
            document.getElementById('image-tools').classList.add('hidden');
            // Show main menu
            document.getElementById('main-tools').classList.remove('hidden');
        }
    </script>
</body>
</html>
