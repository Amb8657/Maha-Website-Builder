<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1A0505; font-family: sans-serif; }
        #canvas { flex-grow: 1; background: #ffffff; color: #000; padding: 20px; overflow-y: auto; }
        
        /* Floating Nested Toolbar */
        #toolbar-container { height: 70px; background: #2D1515; display: flex; flex-direction: column; justify-content: center; }
        .tool-row { display: flex; overflow-x: auto; padding: 0 10px; gap: 10px; align-items: center; }
        .tool-btn { background: #D4AF37; color: #1A0505; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; white-space: nowrap; font-size: 14px; }
        .sub-btn { background: #442222; color: #D4AF37; border: 1px solid #D4AF37; }
        .hidden { display: none !important; }
        
        .element { padding: 10px; border: 2px dashed transparent; }
        .element:hover { border-color: #ccc; }
    </style>
</head>
<body>
    <div id="canvas" contenteditable="true">
        <h2>Maha Project</h2>
        <p>Start designing your layout here...</p>
    </div>
    
    <div id="toolbar-container">
        <!-- Main Categories -->
        <div id="main-tools" class="tool-row">
            <button class="tool-btn" onclick="openMenu('text-menu')">📝 Text</button>
            <button class="tool-btn" onclick="openMenu('image-menu')">🖼️ Image</button>
            <button class="tool-btn" onclick="openMenu('layout-menu')">📐 Layout</button>
            <button class="tool-btn" onclick="openMenu('fx-menu')">✨ Effects</button>
        </div>
        
        <!-- Nested Menus -->
        <div id="text-menu" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn" onclick="inject('<h1 class=\'element\'>New Header</h1>')">+ Header</button>
            <button class="tool-btn sub-btn" onclick="inject('<p class=\'element\'>Paragraph text...</p>')">+ Paragraph</button>
            <button class="tool-btn sub-btn">Bold</button>
        </div>
        
        <div id="image-menu" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn">Upload</button>
            <button class="tool-btn sub-btn">Crop</button>
            <button class="tool-btn sub-btn">Filters</button>
        </div>
        
        <div id="layout-menu" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn">Nudge ↑</button>
            <button class="tool-btn sub-btn">Nudge ↓</button>
            <button class="tool-btn sub-btn">Grid</button>
        </div>

        <div id="fx-menu" class="tool-row hidden">
            <button class="tool-btn sub-btn" onclick="showMain()">← Back</button>
            <button class="tool-btn sub-btn">Shadow</button>
            <button class="tool-btn sub-btn">Opacity</button>
            <button class="tool-btn sub-btn">Blur</button>
        </div>
    </div>

    <script>
        function openMenu(menuId) {
            document.getElementById('main-tools').classList.add('hidden');
            document.getElementById(menuId).classList.remove('hidden');
        }
        function showMain() {
            document.querySelectorAll('.tool-row').forEach(el => el.classList.add('hidden'));
            document.getElementById('main-tools').classList.remove('hidden');
        }
        function inject(html) {
            document.getElementById('canvas').innerHTML += html;
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
