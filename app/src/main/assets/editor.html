<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; background:#1A0505; font-family:sans-serif; }
        #canvas { width:100vw; height:75vh; background:#fff; overflow:auto; position:relative; }
        .toolbar { height:25vh; display:grid; grid-template-columns:repeat(5, 1fr); overflow-y:auto; }
        .tool { background:#D4AF37; color:#1A0505; padding:8px; border:1px solid #000; font-size:9px; text-align:center; }
    </style>
</head>
<body>
    <div id="canvas" contenteditable="true"><h1>Maha Master Project</h1></div>
    <div class="toolbar" id="master-toolbar"></div>
    <script>
        const allTools = ["Header", "Text", "Image", "Video", "Filter", "Mask", "Crop", "Rotate", "Shadow", "Opacity", "Blur", "Grayscale", "Sepia", "Invert", "Brightness", "Contrast", "Saturation", "Hue", "Scale", "FlipH", "FlipV", "Group", "Ungroup", "Lock", "Unlock", "BringToFront", "SendToBack", "AlignLeft", "AlignCenter", "AlignRight", "AlignTop", "AlignBottom", "DistributeH", "DistributeV", "Duplicate", "Delete", "Undo", "Redo", "SelectAll", "Deselect", "Export", "Save", "Preview", "Publish", "Share", "Print", "Settings", "Help", "Templates", "Assets", "Layers", "Shapes", "Frames", "Stickers", "Icons", "Lines", "Arrows", "Charts", "Tables", "Gradients", "Patterns", "Textures", "Typography", "Colors", "Fonts", "Animations", "Transitions", "Audio", "Backgrounds", "Frames", "Masks", "Smart-Mockups", "Charts", "Smart-Resize", "Bulk-Create", "Styles", "Brand-Kit", "Magic-Write", "Magic-Edit", "Magic-Media", "Magic-Design", "Translate", "Text-to-Image", "Audio-to-Video", "Video-Trim", "Speed-Control", "Loop", "Reverse", "Crop-Video", "Volume", "Fade", "Text-Overlay", "Subtitles", "Watermark", "Replace-Media", "Media-Library", "Cloud-Sync", "Offline-Cache"];
        const bar = document.getElementById('master-toolbar');
        allTools.forEach(t => {
            const b = document.createElement('div');
            b.className = 'tool';
            b.innerText = t;
            b.onclick = () => window.Android.executeTool(t);
            bar.appendChild(b);
        });
    </script>
</body>
</html>
