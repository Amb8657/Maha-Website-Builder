<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f0f0f0; }
        #canvas { display: flex; flex-direction: column; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .element { padding: 16px; border: 1px dashed transparent; }
        .element:active { border-color: #D4AF37; }
        h1 { color: #1A0505; }
    </style>
</head>
<body>
    <div id="canvas">
        <div class="element"><h1>Welcome to Maha</h1></div>
        <div class="element"><p>Your grid structure is initialized.</p></div>
    </div>
    <script>
        // JS Bridge ready to receive commands from Android
        function addElement(type, text) {
            const el = document.createElement('div');
            el.className = 'element';
            if(type === 'header') el.innerHTML = '<h1>' + text + '</h1>';
            else el.innerHTML = '<p>' + text + '</p>';
            document.getElementById('canvas').appendChild(el);
        }
    </script>
</body>
</html>
