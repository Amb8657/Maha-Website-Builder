name: Deploy Maha Web Editor
on:
  push:
    branches: [ "main" ]

# Grants permissions needed for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: 🌐 Prepare Web Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract HTML Engine
        run: |
          mkdir -p web_public
          # Copy the hybrid engine and rename it to index.html so the web recognizes it
          cp app/src/main/assets/editor.html web_public/index.html
      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_public

  deploy-web:
    name: 🚀 Publish to Web
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
