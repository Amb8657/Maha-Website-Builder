name: Maha Master QA & Build
on:
  push:
    branches: [ "main" ]

jobs:
  automated-qa:
    name: 🛡️ Automated QA (Visual & Logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: 'zulu', java-version: '17' }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - name: Run In-House Device Simulation & Image Checks
        # Records the golden image then runs the Robolectric behavioral tests
        run: gradle recordPaparazziDebug testDebugUnitTest

  build-production:
    name: 🏗️ Build Application
    needs: automated-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: 'zulu', java-version: '17' }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - name: Compile Application
        run: gradle assembleDebug
      - name: Output Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: QA-Verified-Maha-App
          path: app/build/outputs/apk/debug/app-debug.apk
