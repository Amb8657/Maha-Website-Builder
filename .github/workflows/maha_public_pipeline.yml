name: Maha Zero-Touch QA
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-sign:
    name: Build and Sign Production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/maha_keystore.jks
      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Maha-Production-APK
          path: app/build/outputs/apk/release/app-release.apk

  compatibility-qa:
    name: Compatibility QA (Firebase Test Lab)
    needs: build-and-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Debug APK from Build Job
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - name: Run Firebase Robo Test Matrix
        run: |
          gcloud firebase test android run \
          --type robo \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --device model=Pixel6,version=33 \
          --timeout 5m
