name: Maha Zero-Touch QA
on:
  push:
    branches: [ "main" ]

jobs:
  # STAGE 1: VISUAL IMAGE CHECKING
  visual-qa:
    name: 👁️ Visual UI Image Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Run Image Matcher
        # Using 'gradle' instead of './gradlew' fixes the missing file error you saw earlier
        run: gradle recordPaparazziDebug verifyPaparazziDebug 

  # STAGE 2: COMPILE & SIGN THE APP
  build-and-sign:
    name: 🏗️ Build Production APK
    needs: visual-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/maha_keystore.jks
      - name: Build APKs
        run: gradle assembleDebug assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload Debug APK (For QA)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Final Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Maha-Production-APK
          path: app/build/outputs/apk/release/app-release.apk

  # STAGE 3: FIREBASE PHYSICAL DEVICE TESTING
  compatibility-qa:
    name: 📱 Firebase Device QA Matrix
    needs: build-and-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Run Firebase Robo Physical Touch Test
        run: |
          gcloud firebase test android run \
          --type robo \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --device model=Pixel6,version=33 \
          --device model=SamsungGalaxyS22,version=32 \
          --timeout 5m
