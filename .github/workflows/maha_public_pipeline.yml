name: Maha Zero-Touch QA
on: [push]

jobs:
  # The Visual Quality Assurance Job
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Visual Regression Test
        run: ./gradlew verifyPaparazziDebug # Compares UI against your reference images
        
  # The Global Device Fragmentation Job
  compatibility-qa:
    needs: visual-qa
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - name: Firebase Robo Test Matrix
        run: |
          gcloud firebase test android run \
          --type robo \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --device-model-list .github/device_matrix.txt \
          --num-uniform-shards 5
