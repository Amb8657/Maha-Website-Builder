name: Maha Zero-Touch QA
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-secure:
    name: Build, Secure, and Output APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/maha_keystore.jks
        
      - name: Build and Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
        
      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Maha-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
